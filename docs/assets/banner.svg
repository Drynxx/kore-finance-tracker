<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Sun & Text Gradients -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <rect width="1200" height="360" fill="url(#glowCyan)" />
  <rect width="1200" height="360" fill="url(#glowPurple)" />
  <rect width="1200" height="360" fill="url(#glowCenter)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="0" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Sun Emblem (Vector Re-creation) -->
  <g transform="translate(100, 100)">
    <!-- Core concentric circles -->
    <circle cx="80" cy="80" r="32" fill="none" stroke="url(#sunGrad)" stroke-width="4.5" />
    <circle cx="80" cy="80" r="44" fill="none" stroke="url(#sunGrad)" stroke-width="3" stroke-dasharray="14 8" />
    <circle cx="80" cy="80" r="16" fill="url(#accentGrad)" opacity="0.85" />

    <!-- Radiating Solar Rays (16 rays alternating) -->
    <!-- Ray 0 deg -->
    <line x1="80" y1="20" x2="80" y2="4" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 45 deg -->
    <line x1="122" y1="38" x2="134" y2="26" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 90 deg -->
    <line x1="140" y1="80" x2="156" y2="80" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 135 deg -->
    <line x1="122" y1="122" x2="134" y2="134" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 180 deg -->
    <line x1="80" y1="140" x2="80" y2="156" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 225 deg -->
    <line x1="38" y1="122" x2="26" y2="134" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 270 deg -->
    <line x1="20" y1="80" x2="4" y2="80" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Ray 315 deg -->
    <line x1="38" y1="38" x2="26" y2="26" stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Intermediate minor rays (22.5, 67.5, etc.) -->
    <line x1="103" y1="25" x2="111" y2="15" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="135" y1="57" x2="145" y2="49" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="135" y1="103" x2="145" y2="111" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="103" y1="135" x2="111" y2="145" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="57" y1="135" x2="49" y2="145" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="25" y1="103" x2="15" y2="111" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="25" y1="57" x2="15" y2="49" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="57" y1="25" x2="49" y2="15" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Title & Branding -->
  <text x="310" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="url(#textGrad)">KORE</text>
  <text x="510" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#38bdf8">FINANCIAL INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="312" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Personal finance engineered for clarity. Natural voice logging, automated banking sync, and predictive cash flow analytics.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(312, 235)">
    <!-- Pill 1: Voice & Personal Agent -->
    <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#38bdf8" />
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Kore Personal Agent</text>

    <!-- Pill 2: Android Auto-Pay -->
    <rect x="180" y="0" width="176" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="196" cy="17" r="4" fill="#10b981" />
    <text x="208" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Automated Pay Sync</text>

    <!-- Pill 3: Glassmorphic PWA -->
    <rect x="368" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="384" cy="17" r="4" fill="#818cf8" />
    <text x="396" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Offline-Ready PWA</text>

    <!-- Pill 4: Private & Self-Hostable -->
    <rect x="540" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="556" cy="17" r="4" fill="#f59e0b" />
    <text x="568" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Self-Hostable Appwrite</text>
  </g>
</svg>
