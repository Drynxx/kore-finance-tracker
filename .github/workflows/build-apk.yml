name: Build Kore Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm ci

      - name: Build web application
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: 'https://fra.cloud.appwrite.io/v1'
          VITE_APPWRITE_PROJECT_ID: '69247271000fd2e093f0'
          VITE_APPWRITE_DATABASE_ID: '692472be00265c68d4e3'
          VITE_APPWRITE_COLLECTION_ID: 'transaction'
          VITE_APPWRITE_WALLPAPER_BUCKET_ID: '6925e6ad0016ac1036f4'
          VITE_ELEVENLABS_VOICE_ID: '21m00Tcm4TlvDq8ikWAM'
          VITE_APPWRITE_FUNCTION_ID_GEMINI: '6997105f003043e5aef4'
          VITE_APPWRITE_FUNCTION_ID_ELEVENLABS: '69971161000e7d0277ef'

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
